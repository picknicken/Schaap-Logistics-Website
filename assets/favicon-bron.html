<!doctype html><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:256px;height:256px;overflow:hidden;background:#0b1526;
       display:grid;place-items:center;position:relative;
       font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
  /* De snelheidsstrepen uit het logo, in het rood van de huisstijl. */
  .strepen{position:absolute;left:0;right:0;bottom:46px;height:44px}
  .strepen i{position:absolute;left:0;height:9px;background:#d6010b;
             transform:skewX(-16deg);border-radius:1px}
  .strepen i:nth-child(1){top:0;width:196px}
  .strepen i:nth-child(2){top:17px;width:150px;left:26px}
  .strepen i:nth-child(3){top:34px;width:104px;left:52px}
  span{font-size:178px;font-weight:800;font-style:italic;color:#fff;
       letter-spacing:-.06em;line-height:1;transform:translateY(-22px) skewX(-13deg)}
</style>
<span>S</span>
<div class="strepen"><i></i><i></i><i></i></div>
