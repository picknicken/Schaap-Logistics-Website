<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<!-- De bron van deelkaart.jpg: het plaatje dat WhatsApp, LinkedIn en Facebook
     laten zien als iemand een link naar de site deelt. Wil je de tekst
     veranderen, pas hem hier aan en maak er opnieuw een foto van op precies
     1200 bij 630 punten; sla die op als assets/deelkaart.jpg. -->
<style>
@font-face{font-family:'Inter';font-weight:400 800;src:url('inter.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;
  font-family:'Inter',sans-serif;color:#fff;
  background:radial-gradient(1000px 620px at 78% 12%, #1a2c47 0%, #0b1526 62%);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:64px 72px;position:relative}
body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(90deg,#ffb020 0%,#e08c00 100%)}
.kop{display:flex;align-items:center;gap:22px}
.kop img{height:96px;width:auto;display:block}
h1{font-size:66px;line-height:1.06;letter-spacing:-.03em;font-weight:800;max-width:16ch}
h1 em{font-style:normal;color:#ffb020}
p.sub{margin-top:20px;font-size:27px;line-height:1.45;color:#c3ccdb;max-width:30ch;font-weight:400}
.voet{display:flex;align-items:center;justify-content:space-between;font-size:24px}
.domein{font-weight:700;letter-spacing:.01em}
.merk{display:flex;gap:12px;align-items:center;color:#8e9bb2;font-size:20px}
.punt{width:9px;height:9px;border-radius:50%;background:#ffb020;display:inline-block}
</style></head><body>
<div class="kop"><img src="logo-volledig-wit.png" alt=""></div>
<div>
  <h1>Vandaag opgehaald, <em>vandaag bezorgd</em></h1>
  <p class="sub">Zakelijk spoedtransport door heel Nederland. Rechtstreeks van deur tot deur, prijs vooraf bekend.</p>
</div>
<div class="voet">
  <span class="domein">schaaplogistics.nl</span>
  <span class="merk"><span class="punt"></span> Spoed &middot; Standaard &middot; Internationaal</span>
</div>
</body></html>
