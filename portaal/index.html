<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1526">
<title>Chauffeursportaal — Schaap Logistics</title>
<link rel="icon" href="../assets/favicon.png">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0b1526;
  --navy-2:#111f36;
  --navy-3:#1a2c47;
  --amber:#ffb020;
  --amber-2:#e08c00;
  --urgent:#ff5a3c;
  --paper:#ffffff;
  --paper-2:#f4f6fa;
  --heading:#0b1526;
  --text:#414e68;
  --muted:#6f7c94;
  --line:#e2e7f0;
  --ok:#12a15c;
  --ok-vlak:#e6f5ed;
  --onderweg:#0b6fd4;
  --onderweg-vlak:#e6f0fb;
  --r:14px;
  --shadow:0 1px 2px rgba(11,21,38,.06),0 8px 24px rgba(11,21,38,.07);
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--paper-2);color:var(--text);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3{color:var(--heading);line-height:1.2;letter-spacing:-.02em;font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--amber-2);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* ---------------------------------------------------------------- kop */
.kop{
  background:var(--navy);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 0 14px;
  position:sticky;top:0;z-index:20;
}
.kop__rij{display:flex;align-items:center;gap:12px}
.kop__logo{height:30px;width:auto;flex:none}
.kop__titel{font-size:.95rem;font-weight:700;color:#fff;letter-spacing:-.01em}
.kop__titel small{display:block;font-size:.72rem;font-weight:500;color:#8fa2be;letter-spacing:.04em}
.kop__uit{
  margin-left:auto;font-size:.78rem;color:#8fa2be;
  border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:5px 12px;
}

/* ---------------------------------------------------------------- slot */
.slot{max-width:400px;margin:0 auto;padding:56px 16px}
.slot h1{font-size:1.5rem;margin-bottom:8px}
.slot p{font-size:.93rem;color:var(--muted);margin-bottom:22px}
.veld{display:block;margin-bottom:14px}
.veld span{
  display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}
.veld input{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--heading);
}
.veld input:focus{border-color:var(--amber-2);outline:none}
.veld small{
  display:block;margin-top:6px;font-size:.78rem;color:var(--muted);
  text-transform:none;letter-spacing:0;font-weight:400;line-height:1.45;
}

.knop{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:11px;font-weight:600;font-size:.95rem;
  text-decoration:none;text-align:center;line-height:1.25;
  transition:opacity .15s ease;
}
.knop:active{opacity:.75}
.knop--vol{background:var(--amber);color:var(--navy);width:100%}
.knop--donker{background:var(--navy);color:#fff}
.knop--rand{background:var(--paper);color:var(--heading);border:1.5px solid var(--line)}
.knop--groen{background:var(--ok);color:#fff}
.knop--blauw{background:var(--onderweg);color:#fff}
.knop[disabled]{opacity:.5;pointer-events:none}
/* Annuleren is zeldzaam en onomkeerbaar-aanvoelend. Het hoort bereikbaar te
   zijn, maar niet even hard te roepen als de knop die je elke rit gebruikt. */
.knop--stil{background:none;color:var(--muted);font-size:.85rem;font-weight:500;padding:8px}

.melding{
  border-radius:10px;padding:11px 14px;font-size:.88rem;margin-bottom:14px;
  border-left:3px solid var(--urgent);background:#fdecea;color:#8c2415;
}

/* ------------------------------------------------------------ tabbladen */
.tabs{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--navy);border-top:1px solid rgba(255,255,255,.08);
  position:sticky;top:0;z-index:19;
}
.tab{
  padding:11px 6px 10px;color:#8fa2be;font-size:.8rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  border-bottom:2.5px solid transparent;
}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--amber)}
.tab__badge{
  min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--urgent);color:#fff;font-size:.68rem;font-weight:700;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.tab[aria-selected="true"] .tab__badge{background:var(--amber);color:var(--navy)}
.tab__badge[hidden]{display:none!important}

/* ------------------------------------------------------------ dagbalk */
.dagbalk{
  display:flex;align-items:center;gap:8px;
  background:var(--navy-2);padding:10px 16px;position:sticky;top:0;z-index:19;
}
.dagbalk button{
  width:38px;height:38px;flex:none;border-radius:10px;
  background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;
}
.dagbalk__nu{flex:1;text-align:center;color:#fff;line-height:1.25}
.dagbalk__nu b{display:block;font-size:.95rem;font-weight:700}
.dagbalk__nu span{font-size:.75rem;color:#8fa2be}
.dagbalk__vandaag{
  font-size:.72rem;color:var(--amber);border:1px solid rgba(255,176,32,.4);
  border-radius:99px;padding:4px 10px;width:auto!important;height:auto!important;
}

/* -------------------------------------------------------------- tegels */
.tegels{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border-bottom:1px solid var(--line);
}
.tegel{background:var(--paper);padding:12px 8px;text-align:center}
.tegel b{
  display:block;font-size:1.2rem;font-weight:700;color:var(--heading);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.tegel span{font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* --------------------------------------------------------------- lijst */
.lijst{padding:16px 0 40px;display:grid;gap:12px}

.rit{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.rit--klaar{opacity:.72}
.rit__kop{
  display:flex;gap:12px;align-items:flex-start;padding:14px 16px;
  width:100%;text-align:left;list-style:none;cursor:pointer;
}
.rit__kop::-webkit-details-marker{display:none}
.rit__tijd{
  font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;flex:none;margin-top:2px;
}
.s-gepland{background:var(--paper-2);color:var(--muted);border:1px solid var(--line)}
.s-onderweg{background:var(--onderweg-vlak);color:var(--onderweg);border:1px solid var(--onderweg)}
.s-uitgevoerd{background:var(--ok-vlak);color:var(--ok);border:1px solid var(--ok)}
.s-geannuleerd{background:#fdecea;color:#8c2415;border:1px solid #d9705f}
.rit__hoofd{flex:1;min-width:0}
.rit__klant{font-weight:700;color:var(--heading);font-size:.98rem}
.rit__route{font-size:.85rem;color:var(--muted);margin-top:2px}
.rit__pijl{flex:none;color:var(--muted);transition:transform .2s ease;margin-top:4px}
.rit[open] .rit__pijl{transform:rotate(90deg)}

.rit__lijf{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:14px}
.paar{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:.88rem}
.paar dt{color:var(--muted);font-size:.8rem}
.paar dd{color:var(--heading)}
.knoppen{display:grid;gap:8px}
.knoppen--twee{grid-template-columns:1fr 1fr}

.bewijs{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--ok-vlak);border:1px solid var(--ok);border-radius:10px;
  padding:11px 14px;font-size:.86rem;color:#0a6b3e;
}
.bewijs b{display:block;color:#08512f}
.bewijs--mist{background:#fdecea;border-color:#d9705f;color:#8c2415}
.bewijs--mist b{color:#8c2415}

.leeg{
  text-align:center;padding:48px 20px;color:var(--muted);font-size:.93rem;
  background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);
}

/* ---------------------------------------------- aanvraag- en planningkaart */
.kaart{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.kaart__kop{
  display:flex;gap:12px;align-items:flex-start;padding:14px 16px;
  list-style:none;cursor:pointer;
}
.kaart__kop::-webkit-details-marker{display:none}
.kaart__merk{
  font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;flex:none;margin-top:2px;
  background:var(--paper-2);color:var(--muted);border:1px solid var(--line);
}
.m-spoed{background:#fff4e0;color:#8a5a00;border-color:#e0a94a}
.m-direct{background:#fdecea;color:#8c2415;border-color:#d9705f}
.m-intl{background:var(--onderweg-vlak);color:var(--onderweg);border-color:var(--onderweg)}
.kaart__hoofd{flex:1;min-width:0}
.kaart__titel{font-weight:700;color:var(--heading);font-size:.98rem}
.kaart__regel{font-size:.85rem;color:var(--muted);margin-top:2px}
/* Een terzijde in de kaart zelf: al gedaan, geen actie nodig. Bewust
   geen gekleurd vak, anders vecht het met de waarschuwingen. */
.terzijde{font-size:.85rem;color:var(--muted)}
/* Iets wat je opzoekt en daarna zelf invult. Bewust een link en geen knop:
   er gebeurt niets aan de rit, je gaat even ergens anders kijken. */
.veldlink{font-size:.85rem;color:var(--onderweg);text-decoration:none;
  border-bottom:1px solid currentColor;justify-self:start}

/* Wat de rit jou kostte. Ingeklapt, want tijdens het rijden is het in de weg;
   met de bon in je hand klap je hem open. */
.kosten{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--paper-2)}
.kosten__kop{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:11px 14px;list-style:none;cursor:pointer;
  font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);
}
.kosten__kop::-webkit-details-marker{display:none}
.kosten__kop b{
  font-size:.95rem;font-weight:700;color:var(--heading);letter-spacing:0;
  text-transform:none;font-variant-numeric:tabular-nums;
}
.kosten__lijf{padding:0 14px 14px;display:grid;gap:10px}
.kosten .veld input{background:var(--paper)}
.winst{
  display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--ok-vlak);border:1px solid var(--ok);border-radius:10px;
  padding:8px 12px;
}
.winst span{font-size:.7rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:#0a6b3e}
.winst b{font-size:1.05rem;color:#08512f;font-variant-numeric:tabular-nums}
.kaart__lijf{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:14px}

.prijs{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  background:var(--paper-2);border-radius:10px;padding:10px 14px;
}
.prijs span{font-size:.78rem;color:var(--muted);font-weight:600;
  letter-spacing:.04em;text-transform:uppercase}
.prijs b{font-size:1.05rem;color:var(--heading);font-variant-numeric:tabular-nums}

/* Twee velden naast elkaar (datum + kilometers), of een veld met een knop
   ernaast. In beide gevallen moeten de onderkanten gelijk liggen: het label
   boven het invoervak maakt die kolom hoger dan de knop. */
.velrij{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.velrij--knop{grid-template-columns:1fr auto}
.scheider{
  display:flex;align-items:center;gap:12px;
  font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
}
.scheider::before,.scheider::after{
  content:"";flex:1;height:1px;background:var(--line);
}
.veld select{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--heading);font:inherit;
}

.velrij input{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--heading);
}

/* ---------------------------------------------------------- tekenblad */
.doek{
  position:fixed;inset:0;z-index:40;background:rgba(11,21,38,.6);
  display:flex;align-items:flex-end;justify-content:center;
  padding:16px;overscroll-behavior:contain;
}
.blad{
  background:var(--paper);border-radius:18px;width:100%;max-width:520px;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  display:grid;gap:14px;max-height:92vh;overflow-y:auto;
}
.blad h2{font-size:1.12rem}
.blad__sub{font-size:.85rem;color:var(--muted);margin-top:2px}
.tekenvak{
  border:1.5px dashed var(--line);border-radius:12px;background:var(--paper-2);
  position:relative;overflow:hidden;
}
.tekenvak canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.tekenvak__hint{
  position:absolute;inset:0;display:grid;place-items:center;
  color:var(--muted);font-size:.85rem;pointer-events:none;
}
.tekenvak__lijn{
  position:absolute;left:18px;right:18px;bottom:38px;height:1px;background:var(--line);
}
</style>
</head>
<body>

<!-- ============================ toegang ============================ -->
<div id="slot" class="slot">
  <h1>Chauffeursportaal</h1>
  <p>Je ritten van vandaag, statussen en handtekeningen. Alleen voor Schaap&nbsp;Logistics.</p>
  <div id="slot-melding" class="melding" hidden></div>
  <form id="slot-form">
    <label class="veld" id="slot-adres-veld" hidden>
      <span>Adres van het portaal</span>
      <!-- Bewust type="text": bij type="url" onderschept de browser een typefout
           met een eigen tekstballon, en die zegt minder dan onze eigen melding. -->
      <input type="text" id="slot-adres" inputmode="url"
             placeholder="https://schaap-portaal.....workers.dev"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <small>Dit adres kreeg je van Cloudflare. Je typt het één keer over; daarna onthoudt deze telefoon het.</small>
    </label>
    <label class="veld">
      <span>Toegangscode</span>
      <input type="password" id="slot-code" autocomplete="current-password" required
             autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <button class="knop knop--vol" type="submit">Openen</button>
  </form>
</div>

<!-- ============================= portaal =========================== -->
<div id="app" hidden>

  <header class="kop">
    <div class="wrap kop__rij">
      <img class="kop__logo" src="../assets/logo-sl-wit.png" alt="" width="240" height="177">
      <span class="kop__titel">Schaap Logistics<small>CHAUFFEURSPORTAAL</small></span>
      <button class="kop__uit" id="uitloggen" type="button">Sluiten</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-ritten" role="tab" aria-selected="true" type="button">
      Ritten <span class="tab__badge" id="badge-ritten" hidden>0</span>
    </button>
    <button class="tab" id="tab-aanvragen" role="tab" aria-selected="false" type="button">
      Aanvragen <span class="tab__badge" id="badge-aanvragen" hidden>0</span>
    </button>
    <button class="tab" id="tab-planning" role="tab" aria-selected="false" type="button">
      Planning <span class="tab__badge" id="badge-planning" hidden>0</span>
    </button>
  </div>

  <div id="paneel-ritten">
  <div class="dagbalk">
    <button id="dag-vorige" type="button" aria-label="Vorige dag">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="dagbalk__nu">
      <b id="dag-naam">—</b>
      <span id="dag-datum"></span>
    </div>
    <button class="dagbalk__vandaag" id="dag-vandaag" type="button">Vandaag</button>
    <button id="dag-volgende" type="button" aria-label="Volgende dag">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <div class="tegels">
    <div class="tegel"><b id="t-ritten">–</b><span>Ritten</span></div>
    <div class="tegel"><b id="t-open">–</b><span>Open</span></div>
    <div class="tegel"><b id="t-km">–</b><span>Km</span></div>
    <div class="tegel"><b id="t-omzet">–</b><span>Omzet</span></div>
  </div>

  <div class="wrap">
    <div id="app-melding" class="melding" style="margin-top:16px" hidden></div>
    <div id="lijst" class="lijst"></div>
  </div>
  </div>

  <div id="paneel-aanvragen" class="wrap" hidden>
    <div id="lijst-aanvragen" class="lijst"></div>
  </div>

  <div id="paneel-planning" class="wrap" hidden>
    <div id="lijst-planning" class="lijst"></div>
  </div>
</div>

<!-- =========================== klantblad =========================== -->
<div class="doek" id="klantdoek" hidden>
  <div class="blad" role="dialog" aria-modal="true" aria-labelledby="klant-titel">
    <div>
      <h2 id="klant-titel">Klant koppelen</h2>
      <p class="blad__sub" id="klant-opdracht"></p>
    </div>

    <div id="klant-melding" class="melding" hidden></div>

    <label class="veld" style="margin:0">
      <span>Bestaande klant</span>
      <select id="klant-keuze"></select>
    </label>
    <button class="knop knop--blauw" id="klant-koppel" type="button" style="width:100%">
      Koppelen
    </button>

    <div class="scheider"><span>of maak een nieuwe</span></div>

    <label class="veld" style="margin:0">
      <span>Bedrijfsnaam</span>
      <input type="text" id="klant-naam" autocomplete="organization">
    </label>
    <label class="veld" style="margin:0">
      <span>Adres</span>
      <input type="text" id="klant-adres" placeholder="Straat 1, 1234 AB Plaats">
      <small>Zonder adres kun je later geen factuur versturen.</small>
    </label>
    <div class="knoppen knoppen--twee">
      <label class="veld" style="margin:0">
        <span>Telefoon</span>
        <input type="tel" id="klant-telefoon" autocomplete="tel">
      </label>
      <label class="veld" style="margin:0">
        <span>Termijn</span>
        <input type="number" id="klant-termijn" placeholder="14" min="1" max="180">
      </label>
    </div>
    <label class="veld" style="margin:0">
      <span>E-mail</span>
      <input type="email" id="klant-email" autocomplete="email">
    </label>

    <button class="knop knop--groen" id="klant-nieuw" type="button" style="width:100%">
      Klant aanmaken en koppelen
    </button>
    <button class="knop knop--stil" id="klant-terug" type="button">Annuleren</button>
  </div>
</div>

<!-- =========================== tekenblad =========================== -->
<div class="doek" id="doek" hidden>
  <div class="blad" role="dialog" aria-modal="true" aria-labelledby="blad-titel">
    <div>
      <h2 id="blad-titel">Handtekening voor ontvangst</h2>
      <p class="blad__sub" id="blad-rit"></p>
    </div>

    <div id="blad-melding" class="melding" hidden></div>

    <label class="veld" style="margin:0">
      <span>Naam van de ontvanger</span>
      <input type="text" id="teken-naam" autocomplete="off" placeholder="Wie tekent er?">
    </label>

    <div>
      <div class="tekenvak">
        <canvas id="doekje"></canvas>
        <div class="tekenvak__lijn"></div>
        <div class="tekenvak__hint" id="teken-hint">Teken hier met je vinger</div>
      </div>
    </div>

    <div class="knoppen knoppen--twee">
      <button class="knop knop--rand" id="teken-wis" type="button">Wissen</button>
      <button class="knop knop--rand" id="teken-terug" type="button">Annuleren</button>
    </div>
    <button class="knop knop--groen" id="teken-klaar" type="button" style="width:100%">
      Afgeleverd en getekend
    </button>
  </div>
</div>

<script src="../assets/portaal.js"></script>
</body>
</html>
