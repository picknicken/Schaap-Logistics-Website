# Draait de faaltests bij elke wijziging.
#
# Waarom dit een eigen bestand is en niet een extra taak in
# worker-uitrollen.yml: die workflow start alleen als er iets aan `worker/`
# of `worker-portaal/` verandert, en dat is precies goed — je wilt niet bij
# elke tekstwijziging een Worker opnieuw uitrollen. Maar de faaltests moeten
# juist wél bij elke wijziging draaien: twee van de vier kijken naar de site
# en de portalen, en die veranderen zonder dat er een Worker aan te pas komt.
#
# `on:` geldt per workflow en niet per taak, dus twee triggers betekent twee
# bestanden. Ze samenvoegen zou betekenen dat je ofwel bij elke komma een
# Worker uitrolt, ofwel de tests mist bij een wijziging aan de site.
#
# Wat ze doen staat in tests/LEESMIJ.md. Kort: ze controleren niet of iets
# werkt maar of het stuk te krijgen is.

name: Faaltests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  proeven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deze drie hebben niets nodig: ze roepen de Workers rechtstreeks aan
      # met een nagebootste Airtable.
      - name: Het openbare aanvraagadres
        working-directory: tests
        run: node faal-aanvragen.mjs

      # De portaal-Worker importeert de Anthropic-SDK, voor het lezen van een
      # appje van een klant. Op een schone checkout staat die er niet, en dan
      # kan de proef de Worker niet eens laden. Dezelfde stap staat in
      # worker-uitrollen.yml, om dezelfde reden.
      - name: Afhankelijkheid van het chauffeursportaal
        working-directory: worker-portaal
        run: npm install --no-audit --no-fund

      - name: Het portaal, rollen en grenzen
        working-directory: tests
        run: node faal-portaal.mjs

      # Deze valt om zodra iemand een tarief op één van de twee plekken
      # bijwerkt en de andere vergeet.
      - name: Dezelfde prijs op de server en in de browser
        working-directory: tests
        run: node faal-zelfde-som.mjs

      # De deur van het portaal: de rem op raden en het logboek erachter.
      - name: De toegang tot het portaal
        working-directory: tests
        run: node faal-toegang.mjs

      # Geen factuur zonder klant, en de meldingen die uit de dagklus komen.
      - name: De klantplicht en de dagmeldingen
        working-directory: tests
        run: node faal-klantplicht.mjs

      # Deze legt site.js naast de prijsformule in Airtable. Zonder sleutel
      # toetst hij tegen een transcriptie van die formule — genoeg om een
      # tariefwijziging in site.js te betrappen. Dat iemand de formule in
      # Airtable zelf aanpast ziet hij niet; daar is de tokenlaag voor, en die
      # draai je met de hand. Zie tests/LEESMIJ.md.
      - name: Dezelfde prijs in Airtable als op de site
        working-directory: tests
        run: node faal-zelfde-som-airtable.mjs

      # De twee proeven met een browser. Playwright wordt hier geïnstalleerd
      # en niet in het project: de site zelf heeft geen enkele afhankelijkheid
      # en dat blijft zo. --no-save zorgt dat er geen package.json ontstaat.
      - name: Browser klaarzetten
        run: npm install --no-save --no-audit --no-fund playwright@1

      # --with-deps draait apt-get op de runner om de systeembibliotheken van
      # Chromium bij te zetten, en juist dat viel twee keer achter elkaar om:
      # "Some index files failed to download". Dat is de pakketspiegel van
      # GitHub, niet iets aan deze code — maar het legde wel de hele
      # browserproef stil terwijl er nog geen enkele proef was gestart.
      #
      # Vandaar: drie pogingen, en lukt het dan nog niet, dan de browser zonder
      # die apt-stap. Het image van ubuntu-latest draagt de bibliotheken die
      # Chromium nodig heeft in de regel al. Ontbreekt er toch een, dan valt de
      # browser om in de proef zelf en zie je dat daar — een stap die zwijgt is
      # erger dan een proef die klaagt.
      - name: Chromium ophalen
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Poging $i mislukt; opnieuw over ${i}0 seconden."
            sleep ${i}0
          done
          echo "Systeempakketten lukten niet. Nu alleen de browser."
          npx playwright install chromium

      # Een gewone bestandsserver is genoeg; de proeven zetten de tussenlaag
      # zelf klaar. Wachten tot hij luistert, anders draait de eerste proef
      # tegen een dichte deur.
      - name: De site serveren
        run: |
          python3 -m http.server 8097 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8097/ > /dev/null && break
            sleep 1
          done

      - name: De factuurpagina en de rekenmachine
        working-directory: tests
        env:
          PLAYWRIGHT_PAD: ${{ github.workspace }}/node_modules/playwright/index.js
        run: node faal-site.mjs

      - name: Beide portalen met vijandige gegevens
        working-directory: tests
        env:
          PLAYWRIGHT_PAD: ${{ github.workspace }}/node_modules/playwright/index.js
        run: node faal-portalen.mjs

      # Deze heeft een browser nodig omdat de sleutelpagina de WebCrypto van de
      # browser gebruikt, en juist of die sleutels op de Worker passen is wat
      # hier bewezen wordt. Wat hij niet bewijst — dat er werkelijk een melding
      # op een telefoon verschijnt — staat in tests/LEESMIJ.md.
      - name: De pushmeldingen, van sleutel tot pushdienst
        working-directory: tests
        env:
          PLAYWRIGHT_PAD: ${{ github.workspace }}/node_modules/playwright/index.js
        run: node faal-push.mjs
